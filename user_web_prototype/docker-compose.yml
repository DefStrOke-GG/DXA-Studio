services:
  dxa-api:
    build:
      context: ../dxa_project
      dockerfile: service/Dockerfile
    container_name: dxa_model_api
    ports:
      - "${DXA_API_PORT:-8765}:8765"
    environment:
      DXA_ALLOWED_ROOTS: "/workspace;/data"
      DXA_DEVICE: "${DXA_DEVICE:-auto}"
    volumes:
      - ..:/workspace:ro
      - ../dxa_project/service_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8765/v1/health'))['status']=='ready'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  dxa-user-web:
    build: .
    container_name: dxa_user_web_prototype
    ports:
      - "${DXA_USER_WEB_PORT:-8503}:8503"
    environment:
      USER_WEB_DATA: /data
      DXA_API_URL: http://dxa-api:8765
    volumes:
      - ./prototype_data:/data
      - ../dxa_project:/workspace/dxa_project:ro
    depends_on:
      dxa-api:
        condition: service_healthy
    restart: unless-stopped
